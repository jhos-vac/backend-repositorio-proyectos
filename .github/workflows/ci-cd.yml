name: CI/CD backend

# Gitflow: feature/* -> develop -> main. Solo main despliega en el servidor.
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Verificacion en los servidores de GitHub (no toca tu servidor)
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Generar cliente Prisma
        run: DATABASE_URL="postgresql://build:build@localhost:5432/build" npx prisma generate
      - name: Compilar
        run: npm run build
      # Estos dos no bloquean todavia; cuando esten limpios quita continue-on-error.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true
      - name: Pruebas
        run: npm test --if-present
        continue-on-error: true

  # 2) Despliegue: solo al hacer push a main. Corre en los servidores de GitHub y entra
  #    al VPS por SSH. El entorno "production" guarda los secretos y puede exigir aprobacion.
  #    En el VPS la clave solo puede ejecutar ci-ssh.sh (ver semillero-deploy/docs/DESPLIEGUE-VPS.md).
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: semillero-produccion-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la clave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_KNOWN_HOSTS" ] || { echo "Faltan los secretos VPS_SSH_KEY / VPS_KNOWN_HOSTS del entorno production"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Enviar el codigo y desplegar
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          # Solo los archivos versionados de este commit (sin .git ni node_modules).
          # El VPS respalda (backend), reconstruye el contenedor y comprueba que responda.
          git archive --format=tar.gz HEAD \
            | ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
                "$VPS_USER@$VPS_HOST" deploy backend
