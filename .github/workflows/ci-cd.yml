name: CI/CD backend

on:
  push:
    branches: [main, funcionalidad]
  pull_request:
    branches: [main]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Verificacion en los servidores de GitHub (no toca tu servidor)
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Generar cliente Prisma
        run: DATABASE_URL="postgresql://build:build@localhost:5432/build" npx prisma generate
      - name: Compilar
        run: npm run build
      # Estos dos no bloquean todavia; cuando esten limpios quita continue-on-error.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true
      - name: Pruebas
        run: npm test --if-present
        continue-on-error: true

  # 2) Despliegue: solo al hacer push a main, y corre EN tu servidor (runner autoalojado)
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, semillero]
    steps:
      - uses: actions/checkout@v4
      - name: Copiar codigo y reconstruir
        run: |
          set -e
          APP="$HOME/apps/semillero"
          rsync -a --delete --exclude='.git' --exclude='uploads' --exclude='storage' --exclude='node_modules' ./ "$APP/backend-repositorio-proyectos/"
          cd "$APP"
          flock /tmp/semillero-deploy.lock docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build backend
          docker image prune -f
      - name: Verificar que responde
        run: |
          cd "$HOME/apps/semillero"
          PORT=$(grep '^BACKEND_PORT=' .env.prod | cut -d= -f2)
          for i in $(seq 1 40); do
            if curl -s -o /dev/null --max-time 5 "http://localhost:$PORT/"; then echo "Backend responde"; exit 0; fi
            sleep 3
          done
          echo "El backend no respondio. Ultimos logs:"
          docker logs --tail 60 semillero_backend
          exit 1
